plugins {
    id 'com.android.application'
}

android {
    namespace 'com.orange.videoplayer'
    compileSdk 34

    defaultConfig {
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64' }
        applicationId "com.orange.videoplayer"
        minSdk 24
        targetSdk 34
        versionCode 53
        versionName "6.0"
    }

    signingConfigs {
        release {
            storeFile file("../keystore/myplyr.keystore")
            storePassword "myplyr123"
            keyAlias "myplyr"
            keyPassword "myplyr123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // yt-dlp runtime engine (same core as ytdlnis)
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.17.2'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation 'androidx.core:core-ktx:1.13.1'
}
