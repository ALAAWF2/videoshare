<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyPlyr - المشاهدة الجماعية (Watch Party)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-dark: #090D16;
            --card-bg: #141B2D;
            --accent: #E50914;
            --accent-glow: rgba(229, 9, 20, 0.4);
            --text: #FFFFFF;
            --text-dim: #8B949E;
            --border: #21262D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Header */
        header {
            background: rgba(20, 27, 45, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60%;
        }

        .brand-title span {
            color: var(--accent);
        }

        .room-badge {
            background: rgba(46, 160, 67, 0.15);
            color: #3FB950;
            border: 1px solid rgba(46, 160, 67, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3FB950;
            box-shadow: 0 0 8px #3FB950;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        /* Player Container */
        .player-wrap {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Floating Sync Overlay Badge */
        .sync-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 6px;
            pointer-events: none;
            z-index: 5;
            transition: all 0.3s;
        }

        /* Flying Emojis */
        .flying-emoji {
            position: absolute;
            bottom: 70px;
            font-size: 38px;
            animation: flyUp 2.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            pointer-events: none;
            z-index: 20;
            user-select: none;
        }

        @keyframes flyUp {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.6);
            }
            15% {
                opacity: 1;
                transform: translateY(0) scale(1.2);
            }
            80% {
                opacity: 0.9;
            }
            100% {
                opacity: 0;
                transform: translateY(-340px) scale(1.6);
            }
        }

        /* Reaction Bar */
        .reactions-container {
            background: rgba(20, 27, 45, 0.95);
            backdrop-filter: blur(12px);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border-top: 1px solid var(--border);
            z-index: 10;
        }

        .emoji-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 46px;
            height: 46px;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, background-color 0.15s;
            outline: none;
        }

        .emoji-btn:hover {
            background: #212B45;
            transform: scale(1.15);
        }

        .emoji-btn:active {
            transform: scale(1.35);
        }

        /* Center Join Overlay if no params */
        .join-overlay {
            position: absolute;
            inset: 0;
            background: rgba(9, 13, 22, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            padding: 20px;
        }

        .join-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .join-card h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .join-card p {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 18px;
        }

        .input-box {
            width: 100%;
            padding: 12px 16px;
            background: #090D16;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #FFF;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
            text-align: center;
        }

        .input-box:focus {
            border-color: var(--accent);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #FFF;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand-title" id="titleDisplay">
            <span>🍿</span> <div id="videoTitleText">MyPlyr Watch Party</div>
        </div>
        <div class="room-badge">
            <div class="status-dot" id="statusDot"></div>
            <span id="roomCodeText">WP-0000</span>
        </div>
    </header>

    <!-- Player Area -->
    <div class="player-wrap" id="playerWrap">
        <div class="sync-badge" id="syncStatus">
            <span>🟢</span> <span id="syncText">جاري الاتصال بالسيرفر...</span>
        </div>
        <video id="videoPlayer" controls playsinline webkit-playsinline></video>
    </div>

    <!-- Live Reaction Bar -->
    <div class="reactions-container">
        <button class="emoji-btn" onclick="sendReaction('🔥')">🔥</button>
        <button class="emoji-btn" onclick="sendReaction('❤️')">❤️</button>
        <button class="emoji-btn" onclick="sendReaction('😂')">😂</button>
        <button class="emoji-btn" onclick="sendReaction('👏')">👏</button>
        <button class="emoji-btn" onclick="sendReaction('🍿')">🍿</button>
        <button class="emoji-btn" onclick="sendReaction('😱')">😱</button>
    </div>

    <!-- Manual Join Modal if params missing -->
    <div class="join-overlay" id="joinOverlay" style="display: none;">
        <div class="join-card">
            <h2>🍿 المشاهدة الجماعية</h2>
            <p>أدخل رمز الغرفة ورابط الفيديو للانضمام والمشاهدة المتزامنة</p>
            <input type="text" id="inputRoom" class="input-box" placeholder="رمز الغرفة (مثال: WP-1234)">
            <input type="text" id="inputUrl" class="input-box" placeholder="رابط الفيديو (http://...)">
            <button class="btn-submit" onclick="joinManually()">انضمام الآن</button>
        </div>
    </div>

    <script>
        // Parse Query Params
        const params = new URLSearchParams(window.location.search);
        let room = params.get('room') || '';
        let videoSrc = params.get('src') || '';
        let videoTitle = params.get('title') || 'مشاهدة جماعية';

        const video = document.getElementById('videoPlayer');
        const playerWrap = document.getElementById('playerWrap');
        const roomCodeText = document.getElementById('roomCodeText');
        const videoTitleText = document.getElementById('videoTitleText');
        const syncText = document.getElementById('syncText');
        const statusDot = document.getElementById('statusDot');
        const joinOverlay = document.getElementById('joinOverlay');

        if (!room || !videoSrc) {
            joinOverlay.style.display = 'flex';
        } else {
            initPlayerAndSync();
        }

        function joinManually() {
            const inRoom = document.getElementById('inputRoom').value.trim();
            const inUrl = document.getElementById('inputUrl').value.trim();
            if (!inRoom || !inUrl) {
                alert('يرجى إدخال رمز الغرفة ورابط الفيديو');
                return;
            }
            room = inRoom;
            videoSrc = inUrl;
            joinOverlay.style.display = 'none';
            initPlayerAndSync();
        }

        function initPlayerAndSync() {
            roomCodeText.innerText = room;
            videoTitleText.innerText = decodeURIComponent(videoTitle);

            // Load Video via HLS.js or Native Video
            if (Hls.isSupported() && (videoSrc.includes('.m3u8') || videoSrc.includes('ts'))) {
                const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                hls.loadSource(videoSrc);
                hls.attachMedia(video);
            } else {
                video.src = videoSrc;
            }

            connectWebSocket();
        }

        let ws = null;
        let isSyncingFromHost = false;

        function connectWebSocket() {
            const wsUrl = 'wss://socketsbay.com/wss/v2/1/' + room;
            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    syncText.innerText = 'متصل ومتزامن مع المضيف ✓';
                    statusDot.style.background = '#3FB950';
                    // Announce Join
                    ws.send(JSON.stringify({ action: 'join', sender: 'Safari (iOS)' }));
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        handleSocketMessage(data);
                    } catch (e) {}
                };

                ws.onclose = () => {
                    syncText.innerText = 'انقطع الاتصال، جاري إعادة المحاولة...';
                    statusDot.style.background = '#E50914';
                    setTimeout(connectWebSocket, 2500);
                };

                ws.onerror = () => {
                    syncText.innerText = 'تعذر الاتصال بالسيرفر';
                };
            } catch (e) {
                setTimeout(connectWebSocket, 3000);
            }
        }

        function handleSocketMessage(data) {
            if (data.action === 'sync') {
                const targetPosSec = (data.pos || 0) / 1000.0;
                const isPlaying = (data.state === 'PLAYING');

                isSyncingFromHost = true;
                
                // Adjust position if difference is more than 1.2 seconds
                if (Math.abs(video.currentTime - targetPosSec) > 1.2) {
                    video.currentTime = targetPosSec;
                }

                if (isPlaying && video.paused) {
                    video.play().catch(() => {});
                } else if (!isPlaying && !video.paused) {
                    video.pause();
                }

                setTimeout(() => { isSyncingFromHost = false; }, 300);

            } else if (data.action === 'emoji') {
                spawnFloatingEmoji(data.emoji || '🔥');
            }
        }

        function sendReaction(emoji) {
            spawnFloatingEmoji(emoji);
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    action: 'emoji',
                    emoji: emoji,
                    sender: 'Safari'
                }));
            }
        }

        function spawnFloatingEmoji(emoji) {
            const el = document.createElement('div');
            el.className = 'flying-emoji';
            el.innerText = emoji;
            el.style.left = (15 + Math.random() * 70) + '%';
            playerWrap.appendChild(el);
            setTimeout(() => el.remove(), 2400);
        }
    </script>
</body>
</html>
