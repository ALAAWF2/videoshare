<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyPlyr - المشاهدة الجماعية (Watch Party)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-dark: #090D16;
            --card-bg: #141B2D;
            --accent: #E50914;
            --accent-glow: rgba(229, 9, 20, 0.4);
            --text: #FFFFFF;
            --text-dim: #8B949E;
            --border: #21262D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        header {
            background: rgba(20, 27, 45, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60%;
        }

        .brand-title span {
            color: var(--accent);
        }

        .room-badge {
            background: rgba(46, 160, 67, 0.15);
            color: #3FB950;
            border: 1px solid rgba(46, 160, 67, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3FB950;
            box-shadow: 0 0 8px #3FB950;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        .player-wrap {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .sync-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 6px;
            pointer-events: none;
            z-index: 5;
        }

        /* Mixed Content Alert Card */
        .mixed-content-banner {
            position: absolute;
            inset: 0;
            background: rgba(9, 13, 22, 0.95);
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            z-index: 15;
        }

        .banner-card {
            background: var(--card-bg);
            border: 1px solid rgba(229, 9, 20, 0.4);
            border-radius: 16px;
            padding: 24px;
            max-width: 440px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .banner-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .banner-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #FFF;
        }

        .banner-desc {
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #FFF;
            text-decoration: none;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-bottom: 10px;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: #21262D;
            color: var(--text);
            border: 1px solid var(--border);
        }

        /* Flying Emojis */
        .flying-emoji {
            position: absolute;
            bottom: 70px;
            font-size: 40px;
            animation: flyUp 2.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            pointer-events: none;
            z-index: 20;
            user-select: none;
        }

        @keyframes flyUp {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.6);
            }
            15% {
                opacity: 1;
                transform: translateY(0) scale(1.2);
            }
            80% {
                opacity: 0.9;
            }
            100% {
                opacity: 0;
                transform: translateY(-340px) scale(1.6);
            }
        }

        /* Reaction Bar */
        .reactions-container {
            background: rgba(20, 27, 45, 0.95);
            backdrop-filter: blur(12px);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border-top: 1px solid var(--border);
            z-index: 10;
        }

        .emoji-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 46px;
            height: 46px;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s;
            outline: none;
        }

        .emoji-btn:active {
            transform: scale(1.35);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand-title">
            <span>🍿</span> <div id="videoTitleText">MyPlyr Watch Party</div>
        </div>
        <div class="room-badge">
            <div class="status-dot" id="statusDot"></div>
            <span id="roomCodeText">WP-0000</span>
        </div>
    </header>

    <!-- Player Area -->
    <div class="player-wrap" id="playerWrap">
        <div class="sync-badge" id="syncStatus">
            <span id="syncIcon">🟢</span> <span id="syncText">جاري الاتصال بالسيرفر...</span>
        </div>
        <video id="videoPlayer" controls playsinline webkit-playsinline></video>

        <!-- Mixed Content Helper Overlay -->
        <div class="mixed-content-banner" id="mixedContentBanner" style="display: none;">
            <div class="banner-card">
                <div class="banner-icon">🎬</div>
                <div class="banner-title">تشغيل الفيديو في Safari</div>
                <div class="banner-desc">
                    سيرفر الفيديو يعمل ببروتوكول HTTP. لتشغيله بأعلى سرعة وبدون قيود المتصفح:
                </div>
                <a id="btnDirectPlay" class="btn-action" href="#" target="_blank">
                    ▶️ فتح الفيديو في مشغل Safari الأصلي
                </a>
                <button class="btn-action btn-secondary" onclick="tryProxyStream()">
                    🔄 محاولة التشغيل داخل الصفحة عبر البروكسي
                </button>
            </div>
        </div>
    </div>

    <!-- Live Reaction Bar -->
    <div class="reactions-container">
        <button class="emoji-btn" onclick="sendReaction('🔥')">🔥</button>
        <button class="emoji-btn" onclick="sendReaction('❤️')">❤️</button>
        <button class="emoji-btn" onclick="sendReaction('😂')">😂</button>
        <button class="emoji-btn" onclick="sendReaction('👏')">👏</button>
        <button class="emoji-btn" onclick="sendReaction('🍿')">🍿</button>
        <button class="emoji-btn" onclick="sendReaction('😱')">😱</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let room = (params.get('room') || 'WP-1001').trim();
        let videoSrc = (params.get('src') || '').trim();
        let videoTitle = params.get('title') || 'مشاهدة جماعية';

        const video = document.getElementById('videoPlayer');
        const playerWrap = document.getElementById('playerWrap');
        const roomCodeText = document.getElementById('roomCodeText');
        const videoTitleText = document.getElementById('videoTitleText');
        const syncText = document.getElementById('syncText');
        const statusDot = document.getElementById('statusDot');
        const mixedBanner = document.getElementById('mixedContentBanner');
        const btnDirectPlay = document.getElementById('btnDirectPlay');

        roomCodeText.innerText = room;
        videoTitleText.innerText = decodeURIComponent(videoTitle);
        btnDirectPlay.href = videoSrc;

        // Check for HTTP on HTTPS page
        const isMixed = (window.location.protocol === 'https:' && videoSrc.startsWith('http://'));

        function loadVideo(sourceUrl) {
            if (Hls.isSupported() && (sourceUrl.includes('.m3u8') || sourceUrl.includes('ts'))) {
                const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                hls.loadSource(sourceUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.ERROR, (e, data) => {
                    if (data.fatal && isMixed) {
                        mixedBanner.style.display = 'flex';
                    }
                });
            } else {
                video.src = sourceUrl;
                video.onerror = () => {
                    if (isMixed) {
                        mixedBanner.style.display = 'flex';
                    }
                };
            }
        }

        function tryProxyStream() {
            mixedBanner.style.display = 'none';
            const proxiedUrl = 'https://corsproxy.io/?' + encodeURIComponent(videoSrc);
            loadVideo(proxiedUrl);
            video.play().catch(() => {});
        }

        if (videoSrc) {
            loadVideo(videoSrc);
        }

        // Realtime Signaling via ntfy.sh
        const topic = 'myplyr-party-' + room.toLowerCase();
        let ws = null;

        function connectWebSocket() {
            const wsUrl = 'wss://ntfy.sh/' + topic + '/ws';
            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    syncText.innerText = 'متصل ومتزامن مع المضيف ✓';
                    statusDot.style.background = '#3FB950';
                    publish({ action: 'join', sender: 'Safari (iOS)' });
                };

                ws.onmessage = (event) => {
                    try {
                        const envelope = JSON.parse(event.data);
                        if (envelope.event === 'message' && envelope.message) {
                            const data = JSON.parse(envelope.message);
                            handleSocketMessage(data);
                        }
                    } catch (e) {}
                };

                ws.onclose = () => {
                    syncText.innerText = 'جاري إعادة الاتصال...';
                    statusDot.style.background = '#E50914';
                    setTimeout(connectWebSocket, 2000);
                };

                ws.onerror = () => {
                    syncText.innerText = 'تعذر الاتصال بالسيرفر';
                };
            } catch (e) {
                setTimeout(connectWebSocket, 3000);
            }
        }

        function publish(data) {
            fetch('https://ntfy.sh/' + topic, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain; charset=utf-8' },
                body: JSON.stringify(data)
            }).catch(() => {});
        }

        function handleSocketMessage(data) {
            if (data.action === 'sync') {
                const targetPosSec = (data.pos || 0) / 1000.0;
                const isPlaying = (data.state === 'PLAYING');

                if (Math.abs(video.currentTime - targetPosSec) > 1.5) {
                    video.currentTime = targetPosSec;
                }

                if (isPlaying && video.paused) {
                    video.play().catch(() => {});
                } else if (!isPlaying && !video.paused) {
                    video.pause();
                }

            } else if (data.action === 'emoji') {
                spawnFloatingEmoji(data.emoji || '🔥');
            }
        }

        function sendReaction(emoji) {
            spawnFloatingEmoji(emoji);
            publish({
                action: 'emoji',
                emoji: emoji,
                sender: 'Safari'
            });
        }

        function spawnFloatingEmoji(emoji) {
            const el = document.createElement('div');
            el.className = 'flying-emoji';
            el.innerText = emoji;
            el.style.left = (15 + Math.random() * 70) + '%';
            playerWrap.appendChild(el);
            setTimeout(() => el.remove(), 2400);
        }

        connectWebSocket();
    </script>
</body>
</html>
